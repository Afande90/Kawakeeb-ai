name: Scheduled Agent Jobs

# Runs every 15 minutes and pings the deployed app's cron runner, which
# executes any enabled jobs whose cron expression matches the current time.
#
# Requires two GitHub repo secrets (Settings → Secrets and variables → Actions):
#   APP_URL     = https://your-deployed-app.vercel.app   (no trailing slash)
#   CRON_SECRET = same value as the app's CRON_SECRET env var
#
# Until those are set + the app is deployed, this workflow is a no-op (it
# skips when APP_URL is empty).

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {} # allow manual "Run workflow" from the Actions tab

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cron runner
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret not set — skipping (app not deployed yet)."
            exit 0
          fi
          echo "Pinging $APP_URL/api/cron-jobs/run"
          curl -sS -X POST "$APP_URL/api/cron-jobs/run" \
            -H "Authorization: Bearer $CRON_SECRET" \
            --max-time 290 \
            -w "\nHTTP %{http_code}\n"
